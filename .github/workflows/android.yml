name: Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: bash scripts/android-build.sh
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/output/jiuge-sudoku-coach.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: jiuge-sudoku-coach-apk
          path: android/output/jiuge-sudoku-coach.apk
          if-no-files-found: error
